openapi: 3.1.0
info:
  title: Commerce Demo API
  version: 1.0.0
  description: Deterministic fixture for the Technical Documentation Platform.
servers:
  - url: https://api.example.test
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request
    get:
      operationId: listOrders
      summary: List orders
      responses:
        '200':
          description: Orders returned
  /orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getOrder
      summary: Get an order
      responses:
        '200':
          description: Order returned
        '404':
          description: Order not found
components:
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: string
    Order:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
            - CREATED
            - CANCELLED
