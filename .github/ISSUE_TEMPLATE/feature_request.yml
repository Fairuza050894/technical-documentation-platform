name: Feature request
description: Propose a product, architecture, documentation, or operational capability.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the outcome that is difficult or impossible today.
    validations:
      required: true
  - type: textarea
    id: users
    attributes:
      label: Affected users and workflow
      description: Identify the persona, current journey, and expected improvement.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Describe behavior, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and traceability
      description: Reference requirements, audit findings, source evidence, or comparable internal workflows.
  - type: textarea
    id: risks
    attributes:
      label: Security, compliance, and operational considerations
      description: Note identity, authorization, data classification, outbound access, migration, or release implications.
  - type: checkboxes
    id: principles
    attributes:
      label: Product principles
      options:
        - label: The proposal preserves evidence traceability and does not invent official facts.
          required: true
        - label: Planned and implemented states can be distinguished.
          required: true
