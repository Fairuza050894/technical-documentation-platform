name: Bug report
description: Report reproducible incorrect behavior in the platform or repository automation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer source files, generated confidential documents, or personal data.
        Suspected vulnerabilities must follow SECURITY.md and must not be reported publicly.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is incorrect and what should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start from...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Include request IDs, safe logs, screenshots, or fixture names.
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development
        - Automated test
        - Staging
        - Production
        - Unknown
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, credentials, customer data, and private artifacts.
          required: true
        - label: This is not a vulnerability report.
          required: true
