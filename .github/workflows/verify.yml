name: Verify

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════
  # Security scanning — runs first, fails fast
  # ═══════════════════════════════════════════════════
  security-scan:
    name: Security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        run: uv sync --project backend --dev

      # ── Python dependency audit (1.4.6) ──
      - name: Audit Python dependencies (pip-audit)
        run: |
          uv run --project backend pip-audit \
            --strict \
            --desc \
            --fix --dry-run
        continue-on-error: false

      - name: Audit Python dependencies (safety)
        run: |
          uv run --project backend safety check \
            --full-report \
            --output text
        continue-on-error: true

      # ── Node dependency audit (1.4.6) ──
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit Node dependencies
        run: |
          npm audit --audit-level=high --prefix frontend
        continue-on-error: false

      # ── Secret scanning (1.4.7) ──
      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      # ── Check for hardcoded secrets in source ──
      - name: Scan for hardcoded secrets in source
        run: |
          echo "=== Scanning for potential hardcoded secrets ==="
          # Check for common secret patterns
          FOUND=0

          # AWS keys
          if grep -rn "AKIA[0-9A-Z]\{16\}" backend/src/ frontend/src/ 2>/dev/null; then
            echo "::error::Potential AWS access key found"
            FOUND=1
          fi

          # Private keys
          if grep -rn "BEGIN.*PRIVATE KEY" backend/src/ frontend/src/ 2>/dev/null; then
            echo "::error::Private key found in source"
            FOUND=1
          fi

          # Hardcoded passwords/tokens (common patterns)
          if grep -rn --include="*.py" --include="*.ts" --include="*.tsx" \
            -E "(password|secret|token|api_key)\s*=\s*['\"][^'\"]{8,}" \
            backend/src/ frontend/src/ 2>/dev/null | \
            grep -v "test" | grep -v "example" | grep -v "placeholder"; then
            echo "::warning::Potential hardcoded secret found (review manually)"
          fi

          if [ "$FOUND" = "1" ]; then
            echo "::error::Hardcoded secrets detected — failing build"
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

  # ═══════════════════════════════════════════════════
  # Quality gate — main verification
  # ═══════════════════════════════════════════════════
  quality-gate:
    name: make verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: security-scan

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: uv sync --project backend --dev

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run repository quality gate
        env:
          TDP_ENVIRONMENT: test
          TDP_AUTH_MODE: local
          VITE_API_BASE_URL: /api
        run: make verify