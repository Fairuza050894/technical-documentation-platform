name: Regenerate enterprise foundation docs

on:
  push:
    branches:
      - phase/enterprise-foundation-1-5

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: phase/enterprise-foundation-1-5
          fetch-depth: 0

      - name: Regenerate deterministic repository docs
        run: make docs

      - name: Commit generated documentation
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_generated
          git commit -m "docs: regenerate enterprise foundation indexes"
          git push origin HEAD:phase/enterprise-foundation-1-5
