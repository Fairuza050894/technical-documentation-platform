name: Workbench Requirements Patch
on:
  push:
    branches: [phase/e1-e5-enterprise-core]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase/e1-e5-enterprise-core
      - name: Patch project workbench once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/modules/workbench/ProjectWorkbench.tsx')
          text = path.read_text()
          if 'RequirementsWorkspace' in text:
              raise SystemExit('requirements workbench already wired')
          text = text.replace(
              'import { FeatureWorkspace } from "../features/FeatureWorkspace";\n',
              'import { FeatureWorkspace } from "../features/FeatureWorkspace";\nimport { RequirementsWorkspace } from "../requirements/RequirementsWorkspace";\n',
              1,
          )
          text = text.replace(
              '  { id: "features", label: "Features", icon: "projects", description: "Capability map" },\n  { id: "sources",',
              '  { id: "features", label: "Features", icon: "projects", description: "Capability map" },\n  { id: "requirements", label: "Requirements", icon: "documents", description: "Intent & traceability" },\n  { id: "sources",',
              1,
          )
          text = text.replace(
              '        {stage === "sources" && <SourceWorkspace project={project} embedded />}\n',
              '        {stage === "requirements" && (project.workspace_id ?? workspaceId) !== null && (\n          <RequirementsWorkspace\n            workspaceId={(project.workspace_id ?? workspaceId) as string}\n            project={project}\n          />\n        )}\n        {stage === "sources" && <SourceWorkspace project={project} embedded />}\n',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/modules/workbench/ProjectWorkbench.tsx
          git commit -m 'feat(frontend): wire requirements into project workbench'
          git push origin HEAD:phase/e1-e5-enterprise-core
