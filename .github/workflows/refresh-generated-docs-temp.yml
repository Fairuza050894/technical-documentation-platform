name: Refresh generated docs temporary

on:
  push:
    branches:
      - fix/tdp-solo-ci-integrity-final

permissions:
  contents: write

jobs:
  refresh-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/tdp-solo-ci-integrity-final

      - name: Generate repository evidence
        run: python3 scripts/generate_repository_docs.py

      - name: Commit generated documentation only
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "Generated docs already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_generated
          if git diff --cached --name-only | grep -v '^docs/_generated/' | grep -q .; then
            echo "::error::Generator attempted to stage files outside docs/_generated"
            exit 1
          fi
          git commit -m "docs: regenerate repository evidence"
          git push origin HEAD:fix/tdp-solo-ci-integrity-final
