name: Finalize backend and docs

on:
  push:
    branches:
      - fix/source-backed-ui-integrity-clean

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v6
        with:
          ref: fix/source-backed-ui-integrity-clean

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install backend dependencies
        run: uv sync --project backend --dev

      - name: Normalize backend formatting
        run: uv run --project backend ruff format backend

      - name: Regenerate deterministic repository evidence
        run: python3 scripts/generate_repository_docs.py

      - name: Commit normalized sources and generated evidence
        run: |
          if git diff --quiet -- backend docs/_generated; then
            echo "Backend and generated documentation are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend docs/_generated
          git commit -m "chore: normalize backend and generated evidence"
          git push origin HEAD:fix/source-backed-ui-integrity-clean
