name: Temporary regenerate enterprise docs

on:
  push:
    branches:
      - phase/enterprise-foundation-1-5
    paths:
      - .github/workflows/tmp-regenerate-enterprise-docs.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: phase/enterprise-foundation-1-5
      - name: Regenerate deterministic repository docs
        run: python3 scripts/generate_repository_docs.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated indexes
        shell: bash
        run: |
          if git diff --quiet -- docs/_generated; then
            echo "Generated documentation is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_generated
          git commit -m "docs: regenerate enterprise foundation indexes"
          git push origin HEAD:phase/enterprise-foundation-1-5
